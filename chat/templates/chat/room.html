{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Chat Application</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'chat/images/bg.png' %}"/>
    <style>
body {
  margin: 0 auto;
  max-width: 800px;
  padding: 0 20px;
  background: linear-gradient(to right, #021526, #03346E);
}

.container {
  border: 2px solid #dedede;
  background-color: #D3D3D3;
  border-radius: 5px;
  padding: 10px;
  margin: 10px 0;
}

.darker {
  border-color: #ccc;
  background-color: #ddd;
}

.container::after {
  content: "";
  clear: both;
  display: table;
}

.container img {
  float: left;
  max-width: 60px;
  width: 100%;
  margin-right: 20px;
  border-radius: 50%;
}

.container img.right {
  float: right;
  margin-left: 20px;
  margin-right:0;
}

.time-right {
  float: right;
  color: #aaa;
}

.time-left {
  float: left;
  color: #999;
}


    </style>
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"
            integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>


</head>
<body>

<h2 style="color: white;">{{room}}</h2>

<div id="display">

</div>

<script>
$(document).ready(function(){
  // run this code every 1 second (1000 ms)
setInterval(function(){
    $.ajax({
        type: 'GET',
        url: "/getMessages/{{room}}/",      // hits Django view for this room's messages via urls.py
        success: function(response){       //  This is a callback function that runs only if the server responds successfully (HTTP status 200)..
            console.log(response);
            $("#display").empty();        // clears the message area (div id="display") before re-adding updated messages.
            /* For each message: Create an HTML string with user, message text, and date.
            Append it to #display.*/
            for (var key in response.messages)   // response.messages is expected to be a list/array of messages (from backend).
            {
                var temp="<div class='container darker'><b>"+response.messages[key].user+"</b><p>"+response.messages[key].value+"</p><span class='time-left'>"+response.messages[key].date+"</span></div>";
                $("#display").append(temp);   // empty template which will be filled dynamically
            }
        },
        error: function(response){
            alert('An error occured')
        }
    }); 
},1000);     // repeat every second
})




</script>


<div class="container">
    <style>
    input[type=text], select {
    background-color: #F0FFFF;
    width: 100%;
    padding: 12px 20px;
    margin: 8px 0;
    display: inline-block;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    }

    input[type=submit] {
    width: 100%;
    background-color: #89CFF0;
    color: black;
    padding: 14px 20px;
    margin: 8px 0;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    }

    input[type=submit]:hover {
    background-color: #0047AB;
    }

    div {
    border-radius: 5px;
    background-color: #6495ED;
    padding: 20px;
    }




    </style>

    <form id="post-form">
        {% csrf_token %}
        <input type="hidden" name="username" id="username" value="{{username}}"/>
        <input type="hidden" name="room_id" id="room_id" value="{{room_details.id}}"/>
        <input type="text" name="message" id="message" width="100px"/>
        <input type="submit" value="Send">
    </form>
</div>


</body>

<script type="text/javascript">
      // When the form with id="post-form" is submitted...
  $(document).on('submit','#post-form',function(e){
    e.preventDefault();    // Prevents normal form submission (page reload)

     // Ajax request begins
    $.ajax({
      type:'POST',
      url:'/send',    // must match a route in urls.py
      data:{
          username:$('#username').val(),    // get value from hidden input id="username"
          room_id:$('#room_id').val(),      // get room id (hidden field)
          message:$('#message').val(),       // get the message typed by user
        csrfmiddlewaretoken:$('input[name=csrfmiddlewaretoken]').val(),
      },
      success: function(data){        // This runs when backend responds successfully, HttpResponse() or JSONResponse() from Django is exactly what triggers this.
      }
    });

    // After sending, clear the message box so it's ready for next msg
    document.getElementById('message').value = ''
  });




</script>

</html>
